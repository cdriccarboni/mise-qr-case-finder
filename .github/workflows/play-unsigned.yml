name: Build MISES unsigned Play bundle

on:
  push:
    branches:
      - chatgpt/play-aab-0.4.0-beta.2
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build embedded PWA
        run: |
          npm ci
          npm test
          npm run build
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Allow unsigned release in this isolated build only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          marker = "\nafterEvaluate {"
          i = s.find(marker)
          if i < 0:
              raise SystemExit("afterEvaluate release guard not found")
          p.write_text(s[:i] + "\n")
          PY

      - name: Build unsigned release bundle
        run: gradle -p android :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MISES-unsigned-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
