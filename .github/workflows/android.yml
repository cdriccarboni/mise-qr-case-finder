name: Build MISES Android

on:
  push:
    branches:
      - main
      - grok/mise-finalisation-20260927
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build the local PWA embedded in the APK
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android 16 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build test APK (debug)
        run: gradle -p android :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MISES-Android-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub pre-release APK TEST
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          ASSET="MISES-${VERSION}-TEST.apk"
          cp "$APK" "/tmp/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/$ASSET" --clobber
          else
            gh release create "$TAG" "/tmp/$ASSET" \
              --prerelease \
              --title "MISES! ${VERSION} — APK TEST" \
              --notes "APK Android de test validé par la recette GitHub (unitaires, build PWA, Playwright, assembleDebug). Test uniquement — aucune promotion Google Play production."
          fi
