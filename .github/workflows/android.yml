name: Build MISES Android

on:
  push:
    branches:
      - main
      - grok/mise-finalisation-20260927
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  MISES_UPLOAD_CERT_SHA256: "911F5B046A511E9AF1077CE045219D54FEC1ADFFA584B15C4CFD17665AE5D6CB"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test and build the local PWA embedded in the APK
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build test APK (debug)
        run: gradle -p android :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MISES-Android-build
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore and verify Play upload key when configured
        id: play_signing
        if: github.event_name != 'pull_request'
        env:
          MISE_UPLOAD_KEYSTORE_B64: ${{ secrets.MISE_UPLOAD_KEYSTORE_B64 }}
          MISE_UPLOAD_STORE_PASSWORD: ${{ secrets.MISE_UPLOAD_STORE_PASSWORD }}
          MISE_UPLOAD_KEY_ALIAS: ${{ secrets.MISE_UPLOAD_KEY_ALIAS }}
          MISE_UPLOAD_KEY_PASSWORD: ${{ secrets.MISE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$MISE_UPLOAD_KEYSTORE_B64" ] || [ -z "$MISE_UPLOAD_STORE_PASSWORD" ] || [ -z "$MISE_UPLOAD_KEY_ALIAS" ] || [ -z "$MISE_UPLOAD_KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Clé Play MISES absente des secrets GitHub : APK test seulement."
            exit 0
          fi

          STORE="$RUNNER_TEMP/mises-upload.jks"
          CERT="$RUNNER_TEMP/mises-upload.der"
          printf '%s' "$MISE_UPLOAD_KEYSTORE_B64" | base64 --decode > "$STORE"
          keytool -exportcert -keystore "$STORE" -storepass "$MISE_UPLOAD_STORE_PASSWORD" -alias "$MISE_UPLOAD_KEY_ALIAS" -file "$CERT"
          ACTUAL="$(openssl dgst -sha256 "$CERT" | awk '{print toupper($2)}')"
          if [ "$ACTUAL" != "$MISES_UPLOAD_CERT_SHA256" ]; then
            echo "::error::Mauvaise clé d'upload MISES. SHA-256 reçu: $ACTUAL"
            exit 1
          fi

          echo "MISE_UPLOAD_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "MISE_UPLOAD_STORE_PASSWORD=$MISE_UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MISE_UPLOAD_KEY_ALIAS=$MISE_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MISE_UPLOAD_KEY_PASSWORD=$MISE_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Play AAB
        if: steps.play_signing.outputs.available == 'true'
        run: gradle -p android :app:bundleRelease --stacktrace

      - name: Verify signed Play AAB
        if: steps.play_signing.outputs.available == 'true'
        run: |
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null

      - uses: actions/upload-artifact@v4
        if: steps.play_signing.outputs.available == 'true'
        with:
          name: MISES-Play-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Publish GitHub pre-release APK TEST
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          ASSET="MISES-${VERSION}-TEST.apk"
          cp "$APK" "/tmp/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/$ASSET" --clobber
          else
            gh release create "$TAG" "/tmp/$ASSET"               --prerelease               --title "MISES! ${VERSION} — APK TEST"               --notes "APK Android de test validé par la recette GitHub (unitaires, build PWA, Playwright, assembleDebug). Test uniquement."
          fi

      - name: Attach signed Play AAB to the pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.play_signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(grep -E 'versionCode = ' android/app/build.gradle.kts | head -n1 | grep -oE '[0-9]+')"
          TAG="v${VERSION}"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          ASSET="MISES-${VERSION}-v${VERSION_CODE}-PLAY.aab"
          cp "$AAB" "/tmp/$ASSET"
          gh release upload "$TAG" "/tmp/$ASSET" --clobber
