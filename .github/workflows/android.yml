name: Build MISES ! Android

on:
  push:
    branches:
      - main
      - grok/mise-finalisation-20260927
      - chatgpt/mises-play-internal-0.4.0-beta.3
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
      - "tests/**"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Commit SHA exact approuvé pour une publication Play"
        required: false
        type: string
      expected_version:
        description: "VersionName approuvée"
        required: false
        type: string
      expected_version_code:
        description: "VersionCode Android approuvé"
        required: false
        type: string
      publish_to_play:
        description: "Publier l'AAB signé sur Google Play"
        required: true
        type: boolean
        default: false
      track:
        description: "Canal Google Play"
        required: true
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta

concurrency:
  group: mises-android-${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_play && inputs.track || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  MISES_UPLOAD_CERT_SHA256: "911F5B046A511E9AF1077CE045219D54FEC1ADFFA584B15C4CFD17665AE5D6CB"

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: "fr.acousmatictheatre.mises"
    steps:
      - uses: actions/checkout@v4

      - name: Verify explicit Play release authorization
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_play }}
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_VERSION_CODE: ${{ inputs.expected_version_code }}
          EXPECTED_TRACK: ${{ inputs.track }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Play deliveries are restricted to main"; exit 1; }
          test -n "$EXPECTED_SHA" && test "$GITHUB_SHA" = "$EXPECTED_SHA" || { echo "::error::Commit differs from the approved SHA"; exit 1; }
          case "$EXPECTED_TRACK" in internal|alpha|beta) ;; *) echo "::error::Unauthorized Play track"; exit 1 ;; esac
          VERSION="$(node -p "require('./package.json').version")"
          ANDROID_VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*$/\1/p' android/app/build.gradle.kts | head -n 1)"
          CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*$/\1/p' android/app/build.gradle.kts | head -n 1)"
          PACKAGE="$(sed -nE 's/^val playApplicationId = "([^"]+)".*$/\1/p' android/app/build.gradle.kts | head -n 1)"
          test -n "$EXPECTED_VERSION" && test "$VERSION" = "$EXPECTED_VERSION" && test "$ANDROID_VERSION" = "$EXPECTED_VERSION" || { echo "::error::Version differs from approved version"; exit 1; }
          test -n "$EXPECTED_VERSION_CODE" && test "$CODE" = "$EXPECTED_VERSION_CODE" || { echo "::error::Android versionCode differs from approved version"; exit 1; }
          test "$PACKAGE" = "$PACKAGE_NAME" || { echo "::error::Android package name mismatch"; exit 1; }
          echo "Approved release: sha=$GITHUB_SHA version=$VERSION versionCode=$CODE package=$PACKAGE track=$EXPECTED_TRACK"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Test and build the local PWA embedded in the APK
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore stable MISES ! test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mises-test-signing-v1

      - name: Ensure stable MISES ! test signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=MISES Test,O=Acousmatic Theatre,C=FR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey \
            | grep -E 'Alias name:|SHA256:|Valid from:' || true

      - name: Build test APK (debug)
        run: gradle -p android :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MISES-Android-build
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore and verify Play upload key when configured
        id: play_signing
        if: github.event_name != 'pull_request'
        env:
          MISE_UPLOAD_KEYSTORE_B64: ${{ secrets.MISE_UPLOAD_KEYSTORE_B64 }}
          MISE_UPLOAD_STORE_PASSWORD: ${{ secrets.MISE_UPLOAD_STORE_PASSWORD }}
          MISE_UPLOAD_KEY_ALIAS: ${{ secrets.MISE_UPLOAD_KEY_ALIAS }}
          MISE_UPLOAD_KEY_PASSWORD: ${{ secrets.MISE_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$MISE_UPLOAD_KEYSTORE_B64" ] || [ -z "$MISE_UPLOAD_STORE_PASSWORD" ] || [ -z "$MISE_UPLOAD_KEY_ALIAS" ] || [ -z "$MISE_UPLOAD_KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Clé Play MISES absente des secrets GitHub : APK test seulement."
            exit 0
          fi

          STORE="$RUNNER_TEMP/mises-upload.jks"
          CERT="$RUNNER_TEMP/mises-upload.der"
          printf '%s' "$MISE_UPLOAD_KEYSTORE_B64" | base64 --decode > "$STORE"
          keytool -exportcert -keystore "$STORE" -storepass "$MISE_UPLOAD_STORE_PASSWORD" -alias "$MISE_UPLOAD_KEY_ALIAS" -file "$CERT"
          ACTUAL="$(openssl dgst -sha256 "$CERT" | awk '{print toupper($2)}')"
          if [ "$ACTUAL" != "$MISES_UPLOAD_CERT_SHA256" ]; then
            echo "::error::Mauvaise clé d'upload MISES. SHA-256 reçu: $ACTUAL"
            exit 1
          fi

          echo "MISE_UPLOAD_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "MISE_UPLOAD_STORE_PASSWORD=$MISE_UPLOAD_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MISE_UPLOAD_KEY_ALIAS=$MISE_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MISE_UPLOAD_KEY_PASSWORD=$MISE_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Play AAB
        if: steps.play_signing.outputs.available == 'true'
        run: gradle -p android :app:bundleRelease --stacktrace

      - name: Verify signed Play AAB
        if: steps.play_signing.outputs.available == 'true'
        run: |
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null

      # Signed AABs must not be exported as artifacts from this public repository.
      # Keep them on the ephemeral runner only for an explicitly authorized Play upload.

      - name: Require Play credentials when publishing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_play }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "${{ steps.play_signing.outputs.available }}" != "true" ]; then
            echo "::error::Clé d'upload MISES ! absente ou invalide."
            exit 1
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON absent. La publication Google Play ne peut pas être authentifiée."
            exit 1
          fi

      - name: Publish signed AAB to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_play && github.ref == 'refs/heads/main' }}
        env:
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet google-api-python-client google-auth
          CREDENTIALS="$RUNNER_TEMP/google-play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$CREDENTIALS"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)"
          test -n "$AAB"
          export AAB
          export APP_VERSION="$(node -p "require('./package.json').version")"

          python - <<'PY'
          import os
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          package_name = os.environ["PACKAGE_NAME"]
          track = os.environ["PLAY_TRACK"]
          bundle_path = os.environ["AAB"]
          credentials_path = os.path.join(os.environ["RUNNER_TEMP"], "google-play-service-account.json")

          credentials = service_account.Credentials.from_service_account_file(
              credentials_path,
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build("androidpublisher", "v3", credentials=credentials, cache_discovery=False)

          edit = service.edits().insert(packageName=package_name, body={}).execute()
          edit_id = edit["id"]
          media = MediaFileUpload(bundle_path, mimetype="application/octet-stream", resumable=True)
          bundle = service.edits().bundles().upload(
              packageName=package_name,
              editId=edit_id,
              media_body=media,
          ).execute()

          version_code = str(bundle["versionCode"])
          service.edits().tracks().update(
              packageName=package_name,
              editId=edit_id,
              track=track,
              body={
                  "track": track,
                  "releases": [{
                      "name": f"MISES ! {os.environ.get('APP_VERSION', 'release')}",
                      "versionCodes": [version_code],
                      "status": "completed",
                  }],
              },
          ).execute()
          service.edits().commit(packageName=package_name, editId=edit_id).execute()
          print(f"Published {package_name} versionCode={version_code} to track={track}")
          PY

          rm -f "$CREDENTIALS"

      - name: Publish GitHub pre-release APK TEST
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          ASSET="MISES-${VERSION}-TEST.apk"
          cp "$APK" "/tmp/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/$ASSET" --clobber
          else
            gh release create "$TAG" "/tmp/$ASSET"               --prerelease               --title "MISES ! ${VERSION} — APK TEST"               --notes "APK Android de test validé par la recette GitHub (unitaires, build PWA, Playwright, assembleDebug) avec signature de test persistante. Test uniquement."
          fi
