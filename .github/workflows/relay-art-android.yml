name: Relay ART Android

on:
  push:
    branches:
      - mise/android-play-prep-20260925
    paths:
      - ".github/workflows/relay-art-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout relay repo
        uses: actions/checkout@v4

      - name: Checkout ART main
        uses: actions/checkout@v4
        with:
          repository: cdriccarboni/ART
          ref: main
          path: ART

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate ART Android contract
        working-directory: ART
        run: node --test --experimental-strip-types tests/android-native-v5.test.mts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4


      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build ART APK and AAB
        working-directory: ART/android-test-launcher
        run: |
          chmod +x gradlew
          ART_GIT_COMMIT=$(git -C .. rev-parse HEAD) ./gradlew --no-daemon clean assembleDebug bundleRelease

      - name: Prepare ART artifacts
        run: |
          mkdir -p dist-art
          cp ART/android-test-launcher/app/build/outputs/apk/debug/app-debug.apk dist-art/ART-Android-RC1-debug.apk
          cp ART/android-test-launcher/app/build/outputs/bundle/release/app-release.aab dist-art/ART-Android-RC1-unsigned.aab
          shasum -a 256 dist-art/* > dist-art/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ART-Android-RC1-relay
          path: dist-art/*
          retention-days: 30
